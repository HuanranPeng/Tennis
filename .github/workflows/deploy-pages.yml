# Pushes only the static site files to branch `gh-pages`.
# GitHub Pages: Settings → Pages → Source = "Deploy from a branch"
#   Branch = gh-pages, folder = / (root)
# URL: https://huanranpeng.github.io/Tennis/
name: Deploy to GitHub Pages (gh-pages branch)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with Git LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build site folder
        run: |
          set -e
          rm -rf _site
          mkdir -p _site
          shopt -s nullglob
          cp -r assets css _site/
          for f in *.html; do cp "$f" _site/; done
          touch _site/.nojekyll
          ls -la _site

      - name: Push to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _site
          clean: true
